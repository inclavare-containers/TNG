name: Cargo Deny

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - 'master'

jobs:
  cargo-deny:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
          # Empty on purpose: the action's default arguments are
          # --all-features, and the all-features graph cannot be checked
          # (feature unification merges the js-sdk test path into it, see
          # deny.toml). The policy targets the default-feature graph.
          arguments: ''
