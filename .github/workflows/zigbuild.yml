name: Zigbuild Specify Target

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
        description: compile target
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: compile target

jobs:
  build:
    runs-on: ${{ contains( inputs.target, 'linux' ) && 'ubuntu-latest' || ( contains( inputs.target, 'apple' ) && 'macos-latest' || ( contains( inputs.target, 'windows-msvc' ) && 'windows-latest' || 'ubuntu-latest' ) ) }}
    env:
      # windows-msvc builds natively on a Windows runner. Apple targets also
      # build natively: they run on a macos runner whose clang cross-compiles
      # both arches, and zig's macOS SDK/framework detection broke when the
      # macos-latest image rotated (2026-10: every zig version failed dcap-qvl
      # with "unable to find system framework CoreFoundation"); the
      # build-python-sdk workflow already builds its macOS binaries natively
      # and stayed green through the same rotation. zigbuild remains for the
      # Linux-runner cross targets (aarch64-linux, windows-gnu).
      build-tool: ${{ contains( inputs.target, 'windows-msvc' ) && 'build' || ( contains( inputs.target, 'apple' ) && 'build' || 'zigbuild' ) }}
      executable: ./target/${{inputs.target}}/release/*.exe
      exe_name: ${{ contains( inputs.target, 'windows' ) && 'tng.exe' || 'tng' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup protoc
        uses: arduino/setup-protoc@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install target
        run: rustup target add ${{ inputs.target }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ env.build-tool == 'zigbuild' }}
        with:
          # Pinned, never master: an unpinned setup-zig tracks zig master, so
          # every nightly drift lands in CI untested. 0.17.0 is the stable
          # release of the line the last green zigbuild ran. Bump
          # deliberately, after a green run on the new version.
          version: 0.17.0
      - name: Install cargo-zigbuild
        if: ${{ env.build-tool == 'zigbuild' }}
        run: rustup toolchain add nightly && cargo +nightly install cargo-zigbuild --version 0.19.8
      - name: Install mingw-w64
        if: ${{ contains( inputs.target, 'windows' ) && env.build-tool == 'zigbuild' }}
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cargo compile
        env:
          # Keep the released binary runnable on macOS 11+, matching the
          # wheel workflow's tag. Without this a native clang build would
          # target the build runner's SDK version instead.
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(inputs.target, 'apple') && '11.0' || '' }}
        run: |
          ${{ contains( inputs.target, 'apple' ) && 'RUSTFLAGS="-L native=/usr/lib/ --cfg tokio_unstable"' || 'RUSTFLAGS="--cfg tokio_unstable"'  }} cargo ${{ env.build-tool }} --target ${{ inputs.target }} --release
      - name: Get binary path
        if: ${{ runner.os != 'Windows' }}
        run: |
          if [[ "${{ inputs.target }}" == *"windows"* ]]; then
            echo "executable=./target/${{ inputs.target }}/release/${{ env.exe_name }}" >> "$GITHUB_ENV"
          else
            echo "executable=./target/${{ inputs.target }}/release/${{ env.exe_name }}" >> "$GITHUB_ENV"
          fi

      - name: Build libtng_hook.so (Linux only)
        if: contains( inputs.target, 'linux' )
        run: |
          cargo zigbuild --target ${{ inputs.target }} --release -p tng-hook-cdylib

      - name: Stage artifacts with system path layout
        # Non-Windows targets get the system usr/ layout. Note: windows-gnu is
        # cross-compiled on Linux, so we must gate on the *target*, not runner.os,
        # otherwise windows-gnu would be staged under usr/bin/ and the release
        # zip step (which expects a standalone tng.exe) would find nothing.
        if: ${{ !contains(inputs.target, 'windows') }}
        run: |
          mkdir -p artifacts/usr/bin
          cp "target/${{ inputs.target }}/release/${{ env.exe_name }}" artifacts/usr/bin/
          if [[ "${{ inputs.target }}" == *"linux"* ]]; then
              mkdir -p artifacts/usr/lib/tng
              cp "target/${{ inputs.target }}/release/libtng_hook.so" artifacts/usr/lib/tng/
          fi

      - name: Upload artifact
        if: ${{ !contains(inputs.target, 'windows') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload Windows artifact
        # Upload a standalone tng.exe for Windows targets (both gnu and msvc),
        # matching the release zip step which expects tng.exe at the top level.
        if: ${{ contains(inputs.target, 'windows') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}
          path: target/${{ inputs.target }}/release/${{ env.exe_name }}
          if-no-files-found: error
