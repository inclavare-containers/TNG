name: Run Tests on Source Code

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'master'

env:
  # Route cargo-llvm-cov's instrumented builds into target/ so the CI Rust
  # cache manages them natively; the default target/llvm-cov-target is not
  # covered by the cache.
  CARGO_LLVM_COV_TARGET_DIR: target

jobs:
  test:
    name: test (${{ matrix.distro }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        # Integration tests are split round-robin across shards; each shard is
        # a separate runner, so the shared-netns/iptables serialization inside
        # run-test.sh still holds within each job. Shard 1 additionally runs
        # the unit tests. Keep the count in sync with the /4 passed to
        # --shard below.
        shard: [1, 2, 3, 4]
        distro: [alinux3]
        include:
          # - distro: anolis8
          #   distro_img: registry.openanolis.cn/openanolis/anolisos:8
          # - distro: anolis23
          #   distro_img: registry.openanolis.cn/openanolis/anolisos:23
          - distro: alinux3
            distro_img: "alibaba-cloud-linux-3-registry.cn-hangzhou.cr.aliyuncs.com/alinux3/alinux3:latest"

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ${{ matrix.distro_img }}
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          set -e
          set -x

          # replace the mirror
          sed -i -E 's|https?://mirrors.openanolis.cn/anolis/|https://mirrors.aliyun.com/anolis/|g' /etc/yum.repos.d/*.repo
          sed -i -E 's|https?://mirrors.cloud.aliyuncs.com/|https://mirrors.aliyun.com/|g' /etc/yum.repos.d/*.repo

          if [[ "${{ matrix.distro }}" == anolis23 ]] ; then
              yum install anolis-epao-release -y
          fi

          yum install -y git make tar jq clang

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools  # for providing llvm-profdata and llvm-cov

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the coverage job so it restores what the shards built.
          shared-key: on-source-cov

      - name: Run Attestation Agent, ASR, and Attestation Service
        run: |
          # Start services in background and capture PIDs
          # Use nohup + redirect to avoid Broken pipe when this step's shell exits
          nohup make test-dep-aa > /tmp/aa.log 2>&1 &
          AA_PID=$!
          nohup make test-dep-as > /tmp/as.log 2>&1 &
          AS_PID=$!

          # Wait for ASR TCP :8006 (max 5 minutes)
          echo "Waiting for ASR (PID: $AA_PID)..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8006) 2>/dev/null; then
              echo "ASR is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for ASR"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Agent socket (max 5 minutes)
          echo "Waiting for Attestation Agent socket..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if [ -S /run/confidential-containers/attestation-agent/attestation-agent.sock ]; then
              echo "Attestation Agent is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Agent"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Service HTTP :8080 (max 5 minutes)
          echo "Waiting for Attestation Service (PID: $AS_PID)..."
          for i in $(seq 1 300); do
            if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then
              echo "Attestation Service is ready"
              break
            fi
            if [ $i -gt 60 ] && ! kill -0 $AS_PID 2>/dev/null; then
              echo "Attestation Service process exited unexpectedly"
              cat /tmp/as.log
              exit 1
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Service"
              cat /tmp/as.log
              exit 1
            fi
            sleep 1
          done

      - name: Run unit tests and integration tests
        run: |
          set -e
          set -x

          # Append dns server
          echo "nameserver 8.8.8.8" >> /etc/resolv.conf

          # Export the raw profile data for the coverage job; the per-shard
          # artifacts are merged into one report there.
          args="--shard ${{ matrix.shard }}/4 --export-profraw profraw-export"
          if [[ "${{ matrix.shard }}" -ne 1 ]]; then
              args="$args --skip-unit-tests"
          fi

          make run-test-coverage COV_ARGS="$args"

      - name: Upload raw coverage data
        # Always upload: a failed shard still contributes the coverage of the
        # test binaries that ran before the failure.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: profraw-shard-${{ matrix.shard }}
          path: profraw-export/
          if-no-files-found: warn

      - name: Print background service logs
        if: always()
        run: |
          echo "=== Attestation Agent Log ==="
          cat /tmp/aa.log 2>/dev/null || echo "(no log file)"
          echo "=== Attestation Service Log ==="
          cat /tmp/as.log 2>/dev/null || echo "(no log file)"

  coverage:
    name: coverage (merge)
    needs: test
    # Merge whatever profile data the shards produced even when one shard
    # failed, so the report reflects partial coverage instead of nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: "alibaba-cloud-linux-3-registry.cn-hangzhou.cr.aliyuncs.com/alinux3/alinux3:latest"
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          set -e
          set -x

          # replace the mirror
          sed -i -E 's|https?://mirrors.openanolis.cn/anolis/|https://mirrors.aliyun.com/anolis/|g' /etc/yum.repos.d/*.repo
          sed -i -E 's|https?://mirrors.cloud.aliyuncs.com/|https://mirrors.aliyun.com/|g' /etc/yum.repos.d/*.repo

          yum install -y git make tar jq clang

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools  # for providing llvm-profdata and llvm-cov

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the shard jobs so the compiled dependencies are warm.
          shared-key: on-source-cov

      - name: Download raw coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: profraw-shard-*
          path: profraw-incoming
          merge-multiple: true

      - name: Rebuild instrumented binaries and merge coverage
        run: |
          set -e
          set -x

          make run-test-coverage COV_ARGS="--merge-report profraw-incoming"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/codecov.json
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload codecov.json artifact
        # Preserve the line-level coverage report as a downloadable artifact so
        # it can be inspected without the Codecov web UI.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codecov-json
          path: target/codecov.json
          if-no-files-found: warn
