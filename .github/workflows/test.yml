name: Run Tests on Source Code

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'master'

env:
  # Route cargo-llvm-cov's instrumented builds into target/ so the CI Rust
  # cache manages them natively; the default target/llvm-cov-target is not
  # covered by the cache.
  CARGO_LLVM_COV_TARGET_DIR: target

jobs:
  test:
    name: test (${{ matrix.distro }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        # Integration tests are split round-robin across shards; each shard is
        # a separate runner, so the shared-netns/iptables serialization inside
        # run-test.sh still holds within each job. The unit tests run in the
        # separate `unit` job so no shard carries that extra ~10 minutes.
        # Keep the count in sync with the /4 passed to --shard below.
        shard: [1, 2, 3, 4]
        distro: [alinux3]
        include:
          # Builder image from builder-image.yml: alinux3 base with the full
          # dependency set (including the alinux3-only trustee RPM) baked in,
          # so these jobs skip the ~11-minute inline yum over China-hosted
          # mirrors.
          - distro: alinux3
            distro_img: "ghcr.io/inclavare-containers/tng-ci:alinux3"

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ${{ matrix.distro_img }}
      options: --privileged
    steps:
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools  # for providing llvm-profdata and llvm-cov

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the coverage job so it restores what the shards built.
          shared-key: on-source-cov

      - name: Run Attestation Agent, ASR, and Attestation Service
        run: |
          # Start services in background and capture PIDs
          # Use nohup + redirect to avoid Broken pipe when this step's shell exits
          nohup make test-dep-aa > /tmp/aa.log 2>&1 &
          AA_PID=$!
          nohup make test-dep-as > /tmp/as.log 2>&1 &
          AS_PID=$!

          # Wait for ASR TCP :8006 (max 5 minutes)
          echo "Waiting for ASR (PID: $AA_PID)..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8006) 2>/dev/null; then
              echo "ASR is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for ASR"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Agent socket (max 5 minutes)
          echo "Waiting for Attestation Agent socket..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if [ -S /run/confidential-containers/attestation-agent/attestation-agent.sock ]; then
              echo "Attestation Agent is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Agent"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Service HTTP :8080 (max 5 minutes)
          echo "Waiting for Attestation Service (PID: $AS_PID)..."
          for i in $(seq 1 300); do
            if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then
              echo "Attestation Service is ready"
              break
            fi
            if [ $i -gt 60 ] && ! kill -0 $AS_PID 2>/dev/null; then
              echo "Attestation Service process exited unexpectedly"
              cat /tmp/as.log
              exit 1
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Service"
              cat /tmp/as.log
              exit 1
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          set -e
          set -x

          # Append dns server
          echo "nameserver 8.8.8.8" >> /etc/resolv.conf

          # Each shard generates its partial lcov report locally, where the
          # instrumented binaries already exist; the coverage job merges the
          # per-shard files without ever rebuilding them.
          make run-test-coverage COV_ARGS="--shard ${{ matrix.shard }}/4 --skip-unit-tests --export-lcov lcov-report/shard-${{ matrix.shard }}.info"

      - name: Upload lcov report
        # Always upload: a failed shard still contributes the coverage of the
        # test binaries that ran before the failure.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcov-shard-${{ matrix.shard }}
          path: lcov-report/
          if-no-files-found: warn

      - name: Print background service logs
        if: always()
        run: |
          echo "=== Attestation Agent Log ==="
          cat /tmp/aa.log 2>/dev/null || echo "(no log file)"
          echo "=== Attestation Service Log ==="
          cat /tmp/as.log 2>/dev/null || echo "(no log file)"

  unit:
    name: unit (alinux3)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: "ghcr.io/inclavare-containers/tng-ci:alinux3"
      options: --privileged
    steps:
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools  # for providing llvm-profdata and llvm-cov

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the shard jobs so the compiled dependencies are warm.
          shared-key: on-source-cov

      # The CoCo e2e flow and converter unit tests live in crate lib test
      # modules and talk to AA/AS/ASR, so this job needs the same services the
      # shard jobs start.
      - name: Run Attestation Agent, ASR, and Attestation Service
        run: |
          # Start services in background and capture PIDs
          # Use nohup + redirect to avoid Broken pipe when this step's shell exits
          nohup make test-dep-aa > /tmp/aa.log 2>&1 &
          AA_PID=$!
          nohup make test-dep-as > /tmp/as.log 2>&1 &
          AS_PID=$!

          # Wait for ASR TCP :8006 (max 5 minutes)
          echo "Waiting for ASR (PID: $AA_PID)..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8006) 2>/dev/null; then
              echo "ASR is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for ASR"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Agent socket (max 5 minutes)
          echo "Waiting for Attestation Agent socket..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if [ -S /run/confidential-containers/attestation-agent/attestation-agent.sock ]; then
              echo "Attestation Agent is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Agent"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Service HTTP :8080 (max 5 minutes)
          echo "Waiting for Attestation Service (PID: $AS_PID)..."
          for i in $(seq 1 300); do
            if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then
              echo "Attestation Service is ready"
              break
            fi
            if [ $i -gt 60 ] && ! kill -0 $AS_PID 2>/dev/null; then
              echo "Attestation Service process exited unexpectedly"
              cat /tmp/as.log
              exit 1
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Service"
              cat /tmp/as.log
              exit 1
            fi
            sleep 1
          done

      - name: Run unit tests
        run: |
          set -e
          set -x

          # Unit tests only; their partial lcov report joins the shards' in
          # the coverage merge job.
          make run-test-coverage COV_ARGS="--skip-integration-tests --export-lcov lcov-report/unit.info"

      - name: Upload lcov report
        # Always upload: a failed unit job still contributes the coverage of
        # the crates that ran before the failure.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcov-unit
          path: lcov-report/
          if-no-files-found: warn

      - name: Print background service logs
        if: always()
        run: |
          echo "=== Attestation Agent Log ==="
          cat /tmp/aa.log 2>/dev/null || echo "(no log file)"
          echo "=== Attestation Service Log ==="
          cat /tmp/as.log 2>/dev/null || echo "(no log file)"

  coverage:
    name: coverage (merge)
    needs: [test, unit]
    # Merge whatever lcov data the shard and unit jobs produced even when one
    # of them failed, so the report reflects partial coverage instead of
    # nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: "ghcr.io/inclavare-containers/tng-ci:alinux3"
    steps:
      # Text-level lcov merge only: no compiler, no toolchain, no rebuild.
      - uses: actions/checkout@v6

      - name: Download lcov reports
        uses: actions/download-artifact@v4
        with:
          # lcov-shard-* from the test job plus lcov-unit from the unit job.
          pattern: lcov-*
          path: lcov-incoming
          merge-multiple: true

      - name: Merge lcov reports
        run: |
          set -e
          set -x

          ./tng-testsuite/run-test.sh --coverage --merge-lcov lcov-incoming

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/merged-lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload merged lcov artifact
        # Preserve the line-level coverage report as a downloadable artifact so
        # it can be inspected without the Codecov web UI.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/merged-lcov.info
          if-no-files-found: warn
