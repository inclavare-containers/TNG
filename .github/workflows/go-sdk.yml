name: Go SDK Tests

on:
  push:
    branches:
      - "master"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "master"

jobs:
  go-sdk-tests:
    # The self-hosted oracle-vm pool is small and shared with the on-source
    # test workflow, which used to queue this job for over an hour. The
    # suite runs fine in a privileged container on GitHub-hosted runners,
    # same setup as build-rpm's on-bin test job.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      # Builder image from builder-image.yml: alinux3 base with the full
      # dependency set (including the alinux3-only trustee RPM) baked in, so
      # this job skips the ~11-minute inline yum over China-hosted mirrors.
      image: ghcr.io/inclavare-containers/tng-ci:alinux3
      options: --privileged

    steps:
      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: actions/checkout@v6
        with:
          submodules: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build TNG binary
        run: cargo build --release -p tng

      - name: Run Go unit tests
        run: cd tng-go && go test -v ./...
        env:
          TNG_BINARY: "${{ github.workspace }}/target/release/tng"

      - name: Run go vet
        run: cd tng-go && go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: tng-go
          args: --timeout=5m
        env:
          GOFLAGS: -buildvcs=false

      - name: Start Attestation Agent and Attestation Service
        run: |
          nohup make test-dep-aa > /tmp/aa.log 2>&1 &
          AA_PID=$!
          nohup make test-dep-as > /tmp/as.log 2>&1 &
          AS_PID=$!

          # Wait for ASR (max 5 minutes)
          echo "Waiting for ASR..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "AA process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8006) 2>/dev/null; then
              echo "ASR is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for ASR"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for AA socket
          echo "Waiting for AA socket..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "AA process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if [ -S /run/confidential-containers/attestation-agent/attestation-agent.sock ]; then
              echo "AA is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for AA"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for AS
          echo "Waiting for AS..."
          for i in $(seq 1 300); do
            if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then
              echo "AS is ready"
              break
            fi
            if [ $i -gt 60 ] && ! kill -0 $AS_PID 2>/dev/null; then
              echo "AS process exited unexpectedly"
              cat /tmp/as.log
              exit 1
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for AS"
              cat /tmp/as.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Go integration tests
        run: cd tng-go && go test -tags=integration -v ./...
        env:
          TNG_BINARY: "${{ github.workspace }}/target/release/tng"

      - name: Run Go SDK tng-testsuite tests
        run: |
          # Glob pattern -- cargo expands go_sdk_* to match all go_sdk_* test
          # binaries. New tests are auto-discovered without updating the workflow.
          cargo test --package tng-testsuite \
            --features on-source-code,go-sdk \
            --test 'go_sdk_*' -- --test-threads=1
        env:
          TNG_BINARY: "${{ github.workspace }}/target/release/tng"

      - name: Print background service logs
        if: always()
        run: |
          echo "=== Attestation Agent Log ==="
          cat /tmp/aa.log 2>/dev/null || echo "(no log file)"
          echo "=== Attestation Service Log ==="
          cat /tmp/as.log 2>/dev/null || echo "(no log file)"
