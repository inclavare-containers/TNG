name: Cargo Clippy

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - 'master'

jobs:
  clippy:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: rockylinux:8
    steps:
      - name: Install build dependencies
        run: |
          set -e
          set -x

          # PowerTools carries the -devel packages that the spec's
          # BuildRequires (protobuf-devel) pulls in via yum-builddep.
          yum install -y yum-utils
          yum-config-manager -y --enable powertools

          # install build tools. cargo is deliberately not installed here:
          # the rustup toolchain below provides it, and a system cargo makes
          # the toolchain installer warn about an existing Rust.
          yum install -y make git protobuf-devel yum-utils perl openssl-devel clang

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install build dependencies
        # This job uses the rustup toolchain, so skip the spec's system
        # cargo/rust BuildRequires. Rocky 8's repo does not reliably carry the
        # pinned >= 1.89.0 versions, and yum-builddep fails when they are
        # missing or older. --skip-broken also tolerates an appstream gcc whose
        # libgcc is not yet in the base repo; clippy builds with clang.
        run: yum-builddep -y --skip-unavailable --skip-broken -D 'with_rustup 1' ./trusted-network-gateway.spec

      - name: Install Clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo Clippy
        run: make clippy

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cargo Clippy (wasm32)
        run: make clippy-wasm
