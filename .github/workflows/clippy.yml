name: Cargo Clippy

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - 'master'

jobs:
  clippy:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: rockylinux:8
    steps:
      - name: Install build dependencies
        run: |
          set -e
          set -x

          # PowerTools carries the -devel packages that the spec's
          # BuildRequires (protobuf-devel) pulls in via yum-builddep.
          yum install -y yum-utils
          yum-config-manager -y --enable powertools

          # install build tools
          yum install -y make git cargo protobuf-devel yum-utils perl openssl-devel clang

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install build dependencies
        run: yum-builddep -y --skip-unavailable ./trusted-network-gateway.spec

      - name: Install Clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo Clippy
        run: make clippy
