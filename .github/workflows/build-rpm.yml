name: Build RPM Package

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    outputs:
      rpm_name_an8: ${{ steps.extract-rpm-name.outputs.rpm_name_an8 }}
      PRE_RELEASE: ${{ steps.check-pre-release.outputs.PRE_RELEASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Check pre-release
        id: check-pre-release
        run: |
          tag="${GITHUB_REF#refs/*/}"
          echo "tag=$tag"
          if [[ ${tag} == *alpha* || ${tag} == *beta* ]]
          then
              prerelease=true
          else
              prerelease=false
          fi
          echo "prerelease=$prerelease"
          echo "PRE_RELEASE=$prerelease" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-07-07

      - name: Create build tarball
        run: |
          make create-tarball
          mv /tmp/trusted-network-gateway-*-vendored-source.tar.gz ./

      - name: Prepare AnolisOS8 buildspec and export version info
        id: extract-rpm-name
        run: |
          GITHUB_RELEASE="${{ github.ref_name || 'no_tag' }}"
          VERSION=$(grep -m1 '^Version:' trusted-network-gateway.spec | awk '{print $2}')
          RELEASE="1"

          echo "Using GITHUB_RELEASE: $GITHUB_RELEASE"
          echo "Using VERSION: $VERSION"
          echo "Using RELEASE: $RELEASE"

          # Create buildspec for release
          export GITHUB_RELEASE VERSION RELEASE
          envsubst '$GITHUB_RELEASE $VERSION $RELEASE' \
            < rpm/AnolisOS8/trusted-network-gateway.an8.buildspec.yaml.template \
            > ./trusted-network-gateway-${VERSION}-${RELEASE}.an8.buildspec.yaml

          # Copy buildspec for local build
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          cp ./trusted-network-gateway-${VERSION}-${RELEASE}.an8.buildspec.yaml rpm/AnolisOS8/trusted-network-gateway.an8.buildspec.yaml
          # Replace URL with local path for local build
          yq -i ".inputs.vendored-source.url = \"file://${GITHUB_WORKSPACE}/trusted-network-gateway-${VERSION}-vendored-source.tar.gz\"" rpm/AnolisOS8/trusted-network-gateway.an8.buildspec.yaml

          # Export rpm_name for use in other steps and jobs
          echo "rpm_name_an8=trusted-network-gateway-${VERSION}-${RELEASE}.an8" >> $GITHUB_OUTPUT

      - name: Upload build input artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-input
          if-no-files-found: error
          path: |
            ./trusted-network-gateway-*-vendored-source.tar.gz
            ./trusted-network-gateway-*.an8.buildspec.yaml

      - name: Build RPM package
        uses: 1570005763/GuanFu@v1
        with:
          spec_path: rpm/AnolisOS8/trusted-network-gateway.an8.buildspec.yaml

      - name: Upload build output artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          if-no-files-found: error
          path: |
            /tmp/rpmbuild/SRPMS/trusted-network-gateway-*.an8.src.rpm
            /tmp/rpmbuild/RPMS/x86_64/trusted-network-gateway-*.an8.x86_64.rpm

  test:
    strategy:
      fail-fast: false
      matrix:
        # distro: [anolis8, anolis23, alinux3]
        distro: [alinux3]
        include:
          # - distro: anolis8
          #   distro_img: registry.openanolis.cn/openanolis/anolisos:8
          # - distro: anolis23
          #   distro_img: registry.openanolis.cn/openanolis/anolisos:23
          # Builder image from builder-image.yml: alinux3 base with the full
          # dependency set (including the alinux3-only trustee RPM) baked in,
          # so this job skips the ~11-minute inline yum over China-hosted
          # mirrors.
          - distro: alinux3
            distro_img: "ghcr.io/inclavare-containers/tng-ci:alinux3"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    needs: build
    container:
      image: ${{ matrix.distro_img }}
      options: --privileged
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ./
          merge-multiple: false

      - name: Install RPM packages
        run: |
          set -e
          set -x

          # test rpm package install
          yum install -y ./RPMS/*/trusted-network-gateway-*.rpm
          tng --version

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Run Attestation Agent and Attestation Service
        run: |
          # Start services in background and capture PIDs
          # Use nohup + redirect to avoid Broken pipe when this step's shell exits
          nohup make test-dep-aa > /tmp/aa.log 2>&1 &
          AA_PID=$!
          nohup make test-dep-as > /tmp/as.log 2>&1 &
          AS_PID=$!

          # Wait for ASR TCP :8006 (max 5 minutes)
          echo "Waiting for ASR (PID: $AA_PID)..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8006) 2>/dev/null; then
              echo "ASR is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for ASR"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Agent socket (max 5 minutes)
          echo "Waiting for Attestation Agent socket..."
          for i in $(seq 1 300); do
            if ! kill -0 $AA_PID 2>/dev/null; then
              echo "Attestation Agent / ASR process exited unexpectedly"
              cat /tmp/aa.log
              exit 1
            fi
            if [ -S /run/confidential-containers/attestation-agent/attestation-agent.sock ]; then
              echo "Attestation Agent is ready"
              break
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Agent"
              cat /tmp/aa.log
              exit 1
            fi
            sleep 1
          done

          # Wait for Attestation Service HTTP :8080 (max 5 minutes)
          echo "Waiting for Attestation Service (PID: $AS_PID)..."
          for i in $(seq 1 300); do
            if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then
              echo "Attestation Service is ready"
              break
            fi
            if [ $i -gt 60 ] && ! kill -0 $AS_PID 2>/dev/null; then
              echo "Attestation Service process exited unexpectedly"
              cat /tmp/as.log
              exit 1
            fi
            if [ $i -eq 300 ]; then
              echo "Timeout waiting for Attestation Service"
              cat /tmp/as.log
              exit 1
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          set -e
          set -x

          # Append dns server
          echo "nameserver 8.8.8.8" >> /etc/resolv.conf
          # Run test
          make run-test-on-bin

      - name: Print background service logs
        if: always()
        run: |
          echo "=== Attestation Agent Log ==="
          cat /tmp/aa.log 2>/dev/null || echo "(no log file)"
          echo "=== Attestation Service Log ==="
          cat /tmp/as.log 2>/dev/null || echo "(no log file)"

  build-rpm-el7:
    name: Build RPM (glibc 2.17 baseline)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build input
        uses: actions/download-artifact@v8
        with:
          name: build-input
          path: build-input

      - name: Resolve cache key from vendored tarball
        run: |
          TARBALL=$(ls build-input/trusted-network-gateway-*-vendored-source.tar.gz)
          echo "tarball_hash=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Compile cache: exact key per tarball, prefix fallback so a changed
      # tarball reuses most objects incrementally. Without this the ~15 min
      # cold rustc build lands on the workflow critical path; with it warm
      # runs compile in a few minutes and the build -> el7 -> smoke chain
      # stays shorter than the existing build -> test chain.
      - name: Restore compile cache
        uses: actions/cache@v4
        with:
          path: el7-build-cache
          key: el7-rpm-v1-${{ env.tarball_hash }}
          restore-keys: el7-rpm-v1-

      # manylinux2014 (CentOS 7 + devtoolset-10) is the industry-standard
      # glibc 2.17 buildroot, matching the manylinux_2_17 baseline the Python
      # wheels carry. The build runs via `docker run` instead of a job-level
      # `container:` because node20+ actions cannot execute inside a glibc
      # 2.17 container (node itself needs glibc >= 2.28).
      - name: Build RPM in manylinux2014 buildroot
        run: |
          set -euxo pipefail
          mkdir -p rpms el7-build-cache
          docker run --rm \
            -v "$PWD/build-input:/work:ro" \
            -v "$PWD/rpms:/out" \
            -v "$PWD/el7-build-cache:/cache" \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -euxo pipefail -c '
            TARBALL=$(ls /work/trusted-network-gateway-*-vendored-source.tar.gz)
            VERSION=${TARBALL##*/trusted-network-gateway-}
            VERSION=${VERSION%-vendored-source.tar.gz}

            # llvm-toolset provides clang: .cargo/config.toml forces CC=clang
            # for aws-lc-sys because devtoolset-10 gcc (10.2.1) trips the
            # aws-lc-sys compiler-bug detection (GCC bug 95189).
            yum install -y rpm-build llvm-toolset-7.0-clang unzip
            export PATH="/opt/rh/llvm-toolset-7.0/root/usr/bin:/usr/local/bin:$PATH"
            export LD_LIBRARY_PATH="/opt/rh/llvm-toolset-7.0/root/usr/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

            # Pinned protoc matching the Makefile trustee-build pin; the
            # EPEL package is too old for prost.
            curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
            unzip -oq /tmp/protoc.zip -d /usr/local

            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain 1.89.0 --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            rustc --version

            # Shared across runs via the mounted host cache: the vendored
            # build is offline, so this only skips recompiling unchanged
            # crates.
            export CARGO_TARGET_DIR=/cache/target

            mkdir -p /tmp/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            cp "$TARBALL" "/tmp/rpmbuild/SOURCES/trusted-network-gateway-${VERSION}-vendored-source.tar.gz"
            tar -xzf "/tmp/rpmbuild/SOURCES/trusted-network-gateway-${VERSION}-vendored-source.tar.gz" -C /tmp/rpmbuild/SPECS --strip-components=2 "trusted-network-gateway-${VERSION}/src/trusted-network-gateway.spec"

            # rpm 4.11 predates weak dependencies: an unknown Recommends tag
            # is a parse error that aborts rpmbuild, not a warning. Drop the
            # line here; the an8/GuanFu build keeps it because its rpm 4.14
            # understands and records weak deps.
            sed -i "/^Recommends:/d" /tmp/rpmbuild/SPECS/trusted-network-gateway.spec

            # CARGO_TARGET_DIR redirects build products out of the extracted
            # tree for caching, but the spec installs libtng_hook.so from the
            # default src/target location; point that at the same cache dir.
            # The pattern swaps the whole path token, not just its tail, so
            # the builddir prefix from the spec does not end up glued in
            # front. Note: no apostrophes in these comments; the entire
            # script is wrapped in single quotes on the runner side.
            sed -i "s|[^ ]*src/target/release/libtng_hook\.so|${CARGO_TARGET_DIR}/release/libtng_hook.so|" /tmp/rpmbuild/SPECS/trusted-network-gateway.spec

            # BuildRequires mirror the an8 buildspec environment; this job
            # installs the real build tools directly, so skip the check.
            rpmbuild --define "_topdir /tmp/rpmbuild" -ba /tmp/rpmbuild/SPECS/trusted-network-gateway.spec --nodeps --define "with_rustup 1"

            cp /tmp/rpmbuild/RPMS/x86_64/trusted-network-gateway-*.rpm /out/
            '

      # The container runs as root and leaves root-owned files in the cache
      # volume; widen permissions so the runner-side cache upload can read them.
      - name: Fix cache ownership
        run: sudo chmod -R a+rwX el7-build-cache

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-el7
          path: rpms/trusted-network-gateway-*.el7.x86_64.rpm
          if-no-files-found: error

  smoke-rpm-el7:
    name: Smoke test RPM (AnolisOS 7.9)
    runs-on: ubuntu-latest
    needs: build-rpm-el7
    steps:
      - name: Download RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-el7
          path: rpm-el7

      # Native rpm -Uvh on the oldest supported platform: real dependency
      # resolution against glibc 2.17, not --nodeps.
      - name: Install and run on AnolisOS 7.9
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD/rpm-el7:/rpms:ro" \
            docker.io/openanolis/anolisos:7.9-x86_64 \
            bash -euxo pipefail -c '
            yum install -y iptables iproute openssl
            rpm -Uvh /rpms/trusted-network-gateway-*.el7.x86_64.rpm
            tng --version
            ls /usr/lib/tng/libtng_hook.so
            '

  release-rpm-el7:
    name: Attach glibc 2.17 RPM to release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - smoke-rpm-el7
      - release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-el7
          path: rpm-el7

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: rpm-el7/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: 
      - build
      - test
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: 1570005763/GuanFu/.github/workflows/release.yml@v1
    with:
      input_artifact: build-input
      output_artifact: build-output
      release_slsa_provenance: true
      provenance_name: "${{ needs.build.outputs.rpm_name_an8 }}.intoto.jsonl"
      rpm_detail_provenance: true
      upload_provenance_to_rekor: true
      release_tag_name: "${{ github.ref_name }}"
      prerelease: "${{ needs.build.outputs.PRE_RELEASE == 'true' }}"

  update-release-notes:
    name: Update GitHub Release Notes
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: generate-notes
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          echo "Current tag: $CURRENT_TAG"

          # Extract version number from current tag (e.g., v2.5.0-alpha -> v2.5.0)
          CURRENT_VERSION=$(echo "$CURRENT_TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+')
          echo "Current version: $CURRENT_VERSION"

          # Get all stable tags sorted by version
          STABLE_TAGS=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          echo "Stable tags:"
          echo "$STABLE_TAGS" | head -5

          # Check if the stable version of current tag exists
          if echo "$STABLE_TAGS" | grep -q "^${CURRENT_VERSION}$"; then
            echo "Found stable version $CURRENT_VERSION, finding previous tag"
            # Use the stable version as reference, find the one before it
            PREV_TAG=$(echo "$STABLE_TAGS" | grep -A1 "^${CURRENT_VERSION}$" | tail -n1)
          else
            echo "Stable version not found, using most recent stable tag"
            # Current tag is pre-release, find the most recent stable tag
            PREV_TAG=$(echo "$STABLE_TAGS" | head -1)
          fi

          # Fallback: if still no prev tag, use the most recent stable tag
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_VERSION" ]; then
            echo "Fallback: using most recent stable tag"
            PREV_TAG=$(echo "$STABLE_TAGS" | head -1)
          fi
          echo "Previous tag: $PREV_TAG"

          # Release notes come from CHANGELOG.md's section for this version,
          # which make bump-version-* cut before tagging. Fall back to commit
          # subjects for tags that predate the changelog (pre-releases cut
          # without bump-version).
          CURRENT_VERSION_NUM="${CURRENT_VERSION#v}"
          CHANGELOG=$(bash scripts/extract-changelog.sh "$CURRENT_VERSION_NUM" CHANGELOG.md) || true
          if [ -n "$CHANGELOG" ]; then
            echo "Found [$CURRENT_VERSION_NUM] section in CHANGELOG.md"
          else
            echo "WARNING: no [$CURRENT_VERSION_NUM] section in CHANGELOG.md, falling back to commit log"
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- (%h) %s" --no-merges)
            else
              CHANGELOG=$(git log --pretty=format:"- (%h) %s" --no-merges -20)
            fi
          fi

          # Write to file
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          echo "$CHANGELOG" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release_notes.md

          cat release_notes.md

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
