  <text x="51" y="343" class="small">本地应用链路</text>
  <text x="595" y="183" class="small center">共享网络</text>
  <text x="595" y="221" class="teal center">加密隧道</text>
  <rect x="510" y="244" width="170" height="60" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="595" y="269" class="label center">负载均衡</text>
  <text x="595" y="292" class="small center">按协议选择 L4 / L7</text>
  <path d="M 395 273 H 506 M 680 273 H 841" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#tng_zh-data)"/>
  <rect x="845" y="240" width="250" height="65" rx="6" fill="#e2f3f2" stroke="#087f8c" stroke-width="2"/>
  <text x="970" y="267" class="label center">TNG Egress</text>
  <text x="970" y="291" class="small center">隧道出口</text>
  <path d="M 885 305 V 354" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tng_zh-local)"/>
  <text x="900" y="337" class="small">本地后端链路</text>
  <rect x="845" y="360" width="250" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="970" y="389" class="label center">业务服务</text>
  <path d="M 317 305 V 437 H 1112 V 273 H 1099" fill="none" stroke="#78628f" stroke-width="1.8" stroke-dasharray="6 5" marker-start="url(#tng_zh-ra)" marker-end="url(#tng_zh-ra)"/>
  <rect x="355" y="420" width="530" height="31" rx="4" fill="#fff"/>
  <text x="607" y="442" class="purple center">远程证明 · 证据 + 验证策略</text>
  <text x="32" y="485" class="small">验证可内置或外置；证明与验证角色由配置决定。</text>
  <text x="32" y="515" class="small">多副本服务 · OHTTP 密钥共享与轮换</text>
  <path d="M 30 536 H 1170" stroke="#e1e7ed" stroke-width="1.5"/>
  <text x="32" y="568" class="eyebrow">应用接入</text>
  <text x="32" y="599" class="body">端口映射 · HTTP / SOCKS5 · 透明代理 · tng exec</text>
  <text x="32" y="629" class="body">浏览器 / WASM* · Python · Go</text>
  <text x="32" y="667" class="eyebrow">隧道选择</text>
  <rect x="30" y="681" width="365" height="85" rx="6" fill="#f4f9fa" stroke="#d0dfe1"/>
  <rect x="417" y="681" width="365" height="85" rx="6" fill="#f4f9fa" stroke="#d0dfe1"/>
  <rect x="804" y="681" width="365" height="85" rx="6" fill="#f4f9fa" stroke="#d0dfe1"/>
  <text x="49" y="715" class="teal">TCP → RATS-TLS</text>
  <text x="49" y="746" class="small">非复用 / 复用</text>
  <text x="436" y="715" class="teal">HTTP → OHTTP</text>
  <text x="436" y="746" class="small">消息加密 · HTTP 路由</text>
  <text x="823" y="715" class="teal">UDP → QUIC</text>
  <text x="823" y="746" class="small">数据报隧道</text>
  <text x="32" y="801" class="small">* 浏览器 SDK 自身提供客户端 TNG 能力，无需本地守护进程。</text>
  <text x="32" y="829" class="small">加密保护止于 TNG 端点；本地链路是否加密取决于部署。</text>
</svg>
