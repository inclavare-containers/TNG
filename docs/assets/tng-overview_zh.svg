<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="tng_zh-title tng_zh-desc" xml:lang="zh-CN">
  <title id="tng_zh-title">跨可信域通信</title>
  <desc id="tng_zh-desc">TNG · 机密计算场景的通信瑞士军刀. 加密保护止于 TNG 端点；本地链路是否加密取决于部署。 * 浏览器 SDK 自身提供客户端 TNG 能力，无需本地守护进程。</desc>
  <defs>
    <marker id="tng_zh-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#087f8c" stroke-width="1.8"/></marker>
    <marker id="tng_zh-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
    <marker id="tng_zh-ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#78628f" stroke-width="1.6"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #263548; }
      .title { font-size: 32px; font-weight: 650; letter-spacing: -.5px; }
      .sub { font-size: 21px; fill: #526175; }
      .label { font-size: 21px; font-weight: 600; }
      .body { font-size: 19px; }
      .small { font-size: 18px; fill: #526175; }
      .eyebrow { font-size: 17px; font-weight: 650; fill: #526175; letter-spacing: 1px; }
      .teal { font-size: 20px; font-weight: 600; fill: #087f8c; }
      .purple { font-size: 19px; fill: #78628f; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="848" rx="16" fill="#ffffff" stroke="#d7dfe7" stroke-width="1.5"/>
  <text x="32" y="48" class="title">跨可信域通信</text>
  <text x="32" y="82" class="sub">TNG · 机密计算场景的通信瑞士军刀</text>
  <rect x="30" y="124" width="390" height="282" rx="10" fill="#fafbfd" stroke="#a5b1bf" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="790" y="124" width="380" height="345" rx="10" fill="#fafbfd" stroke="#a5b1bf" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="48" y="155" class="label">调用方可信域</text>
  <text x="48" y="184" class="small">VM · Pod / Sidecar · 本地进程</text>
  <text x="808" y="155" class="label">机密服务可信域</text>
  <rect x="834" y="174" width="314" height="244" rx="8" fill="#fff" stroke="#b7c8ca" stroke-width="1.5"/>
  <rect x="813" y="190" width="315" height="232" rx="8" fill="#f1faf9" stroke="#087f8c" stroke-width="1.5"/>
  <text x="829" y="217" class="small">TEE 副本 · VM / Pod</text>
  <rect x="45" y="240" width="160" height="65" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="125" y="266" class="label center">应用</text>
  <text x="125" y="290" class="small center">HTTP · RPC · DB</text>
  <rect x="240" y="240" width="155" height="65" rx="6" fill="#edf8f8" stroke="#087f8c" stroke-width="2"/>
  <text x="317" y="267" class="label center">TNG Ingress</text>
  <text x="317" y="291" class="small center">隧道入口</text>
