[package]
authors = ["Kun Lai <laikun@linux.alibaba.com>"]
edition.workspace = true
license.workspace = true
name = "rats-cert"
version.workspace = true

[dependencies]
anyhow = {workspace = true}
as-any = {workspace = true}
async-trait = {workspace = true}
attestation-service = {workspace = true, default-features = false, optional = true}
base64 = {workspace = true}
bitflags = {workspace = true}
bytes = {workspace = true}
canon-json = {workspace = true, optional = true}
ciborium = {workspace = true}
const-oid = {workspace = true, optional = true}
flatten-json-object = {workspace = true, optional = true}
futures = {workspace = true}
hex = {workspace = true}
itertools = {workspace = true}
jsonwebtoken = {workspace = true}
kbs-types = {workspace = true}
p256 = {workspace = true, optional = true}
pkcs8 = {workspace = true, optional = true}
prost = {workspace = true, optional = true}
protobuf = {workspace = true, optional = true}
rand = "0.8.5"
rcgen = {workspace = true, optional = true}
reference-value-provider-service = {workspace = true, default-features = false, optional = true}
reqwest = {workspace = true, optional = true}
# Direct `regorus` dep so the `crypto.sha256` host-await helper can name
# `regorus::Value` directly (the same single crate attestation-service pulls
# in, via the matching workspace dep). Only needed by the builtin AS path.
regorus = {workspace = true, optional = true}
rsa = {workspace = true, optional = true}
rustls-pki-types = {workspace = true, optional = true}
serde = {workspace = true}
serde_bytes = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true, optional = true}
signature = {workspace = true, optional = true}
spin = {workspace = true}
strum = {workspace = true, features = ["derive"]}
strum_macros = {workspace = true}
thiserror = {workspace = true}
tonic-prost = {workspace = true, optional = true}
tracing = {workspace = true}
ttrpc = {workspace = true, optional = true}
x509-cert = {workspace = true, optional = true}
zeroize = {workspace = true}

[target.'cfg(not(all(target_arch = "wasm32", target_vendor = "unknown", target_os = "unknown")))'.dependencies]
# `fs` is native-only: the builtin converter supports `file://` provenance
# sources and on-disk RV storage / signer key/cert paths; wasm uses in-memory
# RV storage, so `fs` stays off there.
# `policy-rvps` is required: the default policy (`ear_broker::DEFAULT_POLICY`)
# calls the rego builtin `query_reference_value`, registered only under that
# feature; without it appraisal fails with "could not find function
# query_reference_value".
# `regorus-regovm` is enabled on both targets for cross-platform consistency.
# Target-specific re-declaration: cargo merges this with the base
# `[dependencies]` entry for non-wasm only.
attestation-service = {workspace = true, default-features = false, features = ["fs", "policy-rvps", "regorus-regovm"], optional = true}
rustls-webpki = {workspace = true, optional = true, features = ["alloc", "aws-lc-rs"]}
tempfile = {workspace = true, optional = true}
time = {workspace = true, features = ["std", "parsing"]}
tokio = {workspace = true, default-features = true, features = ["fs"]}
tonic = {workspace = true, default-features = false, features = ["codegen", "channel"], optional = true}

[target.'cfg(all(target_arch = "wasm32", target_vendor = "unknown", target_os = "unknown"))'.dependencies]
# `policy-rvps` is required (the default policy calls `query_reference_value`,
# registered only under it); `regorus-regovm` is mandatory on wasm: upstream
# will not compile without it. `fs` is off (in-memory RV storage only).
# getrandom's `wasm_js` feature is wired by attestation-service's own
# `getrandom_04` dep, so the Makefile `getrandom_backend` cfg alone does not
# cover the regorus path. Target-specific re-declaration: cargo merges this
# with the base `[dependencies]` entry for wasm only.
attestation-service = {workspace = true, default-features = false, features = ["policy-rvps", "regorus-regovm"], optional = true}
# Web Crypto API deps for the builtin-as challenger keygen path. On wasm the
# rustcrypto `rsa` prime generation (used by `JwtChallenger::new`) is pure
# software and slow; instead we ask the host (hardware-accelerated) WebCrypto
# `SubtleCrypto::generateKey` for an RSA-2048 key, export it as PKCS#8, and feed
# it to `JwtChallenger::new_with_private_key`. Only pulled on wasm targets.
js-sys = {workspace = true}
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true, features = ["Crypto", "SubtleCrypto", "Window", "CryptoKey"]}
ring = {workspace = true, features = ["wasm32_unknown_unknown_js"]}
rustls-webpki = {workspace = true, optional = true, features = ["alloc", "ring"]}
time = {workspace = true, features = ["std", "wasm-bindgen", "parsing"]}
tokio = {workspace = true, default-features = false}
tokio_with_wasm = {workspace = true}
tonic = {workspace = true, default-features = false, features = ["codegen"], optional = true}
tonic-web-wasm-client = {workspace = true}
web-time = {workspace = true}

[features]
attester-coco = [
  "dep:ttrpc-codegen",
  "dep:ttrpc",
  "dep:protobuf",
  "dep:prost",
  "dep:rustls-webpki",
  "dep:rustls-pki-types",
  "dep:reqwest",
  "dep:flatten-json-object",
  "dep:canon-json",
]
verifier-coco = [
  "dep:tonic-prost-build",
  "dep:tonic-prost",
  "dep:tonic",
  "dep:protobuf",
  "dep:prost",
  "dep:rustls-webpki",
  "dep:rustls-pki-types",
  "dep:reqwest",
  "dep:flatten-json-object",
]

attester-ita = [
  "attester-coco",
]
verifier-ita = [
  "dep:reqwest",
  "dep:flatten-json-object",
]

crypto-rustcrypto = [
  "dep:x509-cert",
  "dep:sha2",
  "dep:p256",
  "dep:rsa",
  "dep:pkcs8",
  "dep:const-oid",
  "dep:signature",
  "dep:rustls-webpki",
  "dep:rustls-pki-types",
]

# Builtin Attestation Service features (local evidence verification)
# __builtin-as should not be used directly. It is auto-enabled when any TEE-specific builtin feature is enabled
# `dep:sha2` is included here so the `crypto.sha256` host-await helper compiles
# whenever builtin-as is on, regardless of the `crypto-rustcrypto` feature —
# honoring the non-crypto fallback path in `load_policy_as_base64_url_safe_no_pad`.
__builtin-as = ["dep:attestation-service", "dep:reference-value-provider-service", "dep:regorus", "dep:flatten-json-object", "dep:tempfile", "dep:rcgen", "dep:sha2"]
builtin-as-all = ["__builtin-as", "attestation-service/all-verifier"]
builtin-as-sgx = ["__builtin-as", "attestation-service/sgx-verifier"]
builtin-as-snp = ["__builtin-as", "attestation-service/snp-verifier"]
builtin-as-tdx-ffi = ["__builtin-as", "attestation-service/tdx-verifier"]
# Pure-Rust dcap-qvl backend (no libtdx-verify/libsgx_dcap_quoteverify link).
# Statically linkable; fetches TDX collateral from a PCCS over HTTPS.
# Mutually exclusive with builtin-as-tdx-ffi (which selects the FFI backend) —
# never enable both in a single build (a compile error is the backstop).
builtin-as-tdx-rust = ["__builtin-as", "attestation-service/tdx-dcap-rust"]

default = ["crypto-rustcrypto", "attester-coco", "verifier-coco", "attester-ita", "verifier-ita", "builtin-as-tdx-rust"]

[dev-dependencies]
ctor = {workspace = true}
rayon = {workspace = true}
rsa = {workspace = true}
rstest = {workspace = true}
serial_test = {workspace = true}
tempfile = {workspace = true}
test-with = {version = "0.16.1", default-features = false}
tokio = {workspace = true, features = ["rt", "rt-multi-thread", "macros"]}
tracing-subscriber = {workspace = true}
wiremock = "0.6"

[build-dependencies]
cfg_aliases = {workspace = true}
tonic-prost-build = {workspace = true, optional = true}
ttrpc-codegen = {workspace = true, optional = true}
